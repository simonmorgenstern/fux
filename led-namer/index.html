<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LED Group Namer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #111; color: #eee; display: flex; height: 100vh; overflow: hidden; }

    #canvas-area { flex: 1; position: relative; overflow: hidden; }
    canvas { display: block; background: #1a1a1a; cursor: crosshair; }

    #sidebar { width: 300px; background: #1e1e1e; border-left: 1px solid #333; display: flex; flex-direction: column; overflow: hidden; }

    #controls { padding: 12px; border-bottom: 1px solid #333; }
    #controls h2 { font-size: 14px; color: #aaa; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }

    .row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
    label { font-size: 12px; color: #888; white-space: nowrap; }

    input[type=text] { flex: 1; background: #2a2a2a; border: 1px solid #444; color: #eee; padding: 6px 8px; border-radius: 4px; font-size: 13px; }
    input[type=text]:focus { outline: none; border-color: #666; }

    button { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 600; }
    .btn-primary   { background: #3a8eff; color: #fff; }
    .btn-danger    { background: #c0392b; color: #fff; }
    .btn-secondary { background: #333; color: #ccc; border: 1px solid #444; }
    .btn-success   { background: #27ae60; color: #fff; }
    button:hover { opacity: 0.85; }

    #sel-count { font-size: 12px; color: #888; margin-bottom: 6px; }

    #groups { flex: 1; overflow-y: auto; padding: 12px; }
    #groups h2 { font-size: 14px; color: #aaa; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }

    .group-item { background: #252525; border: 1px solid #333; border-radius: 6px; margin-bottom: 8px; padding: 8px 10px; }
    .group-header { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    .group-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
    .group-name { font-size: 13px; font-weight: 600; flex: 1; }
    .group-count { font-size: 11px; color: #777; }
    .group-actions { display: flex; gap: 4px; }
    .group-actions button { padding: 3px 8px; font-size: 11px; }
    .group-indices { font-size: 10px; color: #666; word-break: break-all; margin-top: 2px; }

    #footer { padding: 12px; border-top: 1px solid #333; display: flex; gap: 8px; }

    #zoom-info { position: absolute; bottom: 8px; left: 8px; font-size: 11px; color: #555; pointer-events: none; }
  </style>
</head>
<body>

<div id="canvas-area">
  <canvas id="c"></canvas>
  <div id="zoom-info">Scroll to zoom · Drag to pan · Click LED to select · Shift+click deselects</div>
</div>

<div id="sidebar">
  <div id="controls">
    <h2>LED Group Namer</h2>

    <div id="sel-count">No LEDs selected</div>

    <div class="row">
      <input type="text" id="group-name" placeholder="Group name (e.g. diamond)" />
    </div>
    <div class="row">
      <button class="btn-primary" onclick="addGroup()">Add Group</button>
      <button class="btn-secondary" onclick="clearSelection()">Clear sel.</button>
      <button class="btn-secondary" onclick="selectAll()">All</button>
    </div>
    <div class="row">
      <label>Highlight:</label>
      <button class="btn-secondary" onclick="highlightGroup(null)" style="flex:1">None</button>
    </div>
  </div>

  <div id="groups">
    <h2>Groups</h2>
    <div id="group-list"></div>
  </div>

  <div id="footer">
    <button class="btn-success" style="flex:1" onclick="exportJSON()">Export JSON</button>
    <button class="btn-secondary" onclick="importJSON()">Import</button>
  </div>
</div>

<script>

ex":205},{"x":106,"y":463,"index":206},{"x":119,"y":450,"index":207},{"x":135,"y":437,"index":208},{"x":151,"y":421,"index":209},{"x":164,"y":410,"index":210},{"x":178,"y":395,"index":211},{"x":193,"y":381,"index":212},{"x":206,"y":368,"index":213},{"x":127,"y":421,"index":214},{"x":111,"y":409,"index":215},{"x":95,"y":398,"index":216},{"x":82,"y":387,"index":217},{"x":59,"y":380,"index":218},{"x":41,"y":380,"index":219},{"x":144,"y":407,"index":220},{"x":145,"y":387,"index":221},{"x":145,"y":367,"index":222},{"x":140,"y":350,"index":223},{"x":124,"y":338,"index":224},{"x":109,"y":327,"index":225},{"x":94,"y":316,"index":226},{"x":78,"y":304,"index":227},{"x":63,"y":293,"index":228},{"x":48,"y":281,"index":229},{"x":34,"y":270,"index":230},{"x":100,"y":305,"index":231},{"x":121,"y":303,"index":232},{"x":139,"y":301,"index":233},{"x":168,"y":383,"index":234},{"x":174,"y":365,"index":235},{"x":173,"y":341,"index":236},{"x":167,"y":323,"index":237},{"x":161,"y":304,"index":238},{"x":156,"y":285,"index":239},{"x":149,"y":266,"index":240},{"x":144,"y":249,"index":241},{"x":139,"y":230,"index":242},{"x":135,"y":214,"index":243},{"x":166,"y":233,"index":244},{"x":152,"y":219,"index":245},{"x":139,"y":206,"index":246},{"x":115,"y":188,"index":247},{"x":101,"y":175,"index":248},{"x":89,"y":163,"index":249},{"x":71,"y":151,"index":250},{"x":57,"y":145,"index":251},{"x":38,"y":136,"index":252},{"x":22,"y":128,"index":253},{"x":147,"y":115,"index":254},{"x":143,"y":132,"index":255},{"x":140,"y":149,"index":256},{"x":135,"y":168,"index":257},{"x":124,"y":181,"index":258},{"x":115,"y":164,"index":259},{"x":107,"y":148,"index":260},{"x":98,"y":131,"index":261},{"x":89,"y":116,"index":262},{"x":81,"y":102,"index":263},{"x":73,"y":88,"index":264},{"x":65,"y":74,"index":265},{"x":53,"y":53,"index":266},{"x":38,"y":36,"index":267}];

// ── State ─────────────────────────────────────────────────────────────────────
const selected = new Set();
let groups = [];
let highlightedGroup = null;

// ── Palette ───────────────────────────────────────────────────────────────────
const PALETTE = ['#e74c3c','#3498db','#2ecc71','#f39c12','#9b59b6','#1abc9c','#e67e22','#e91e63','#00bcd4','#cddc39'];
let paletteIdx = 0;
function nextColor() { return PALETTE[paletteIdx++ % PALETTE.length]; }

// ── Canvas & viewport ─────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// Compute data bounds
const xs = LEDS.map(l => l.x), ys = LEDS.map(l => l.y);
const dataW = Math.max(...xs), dataH = Math.max(...ys);

// Viewport transform: pan + zoom
let panX = 0, panY = 0, zoom = 1;

function fitToWindow() {
  const area = document.getElementById('canvas-area');
  const W = area.clientWidth, H = area.clientHeight;
  canvas.width = W; canvas.height = H;
  const margin = 40;
  zoom = Math.min((W - margin * 2) / dataW, (H - margin * 2) / dataH);
  panX = (W - dataW * zoom) / 2;
  panY = (H - dataH * zoom) / 2;
}

function toScreen(x, y) {
  return [x * zoom + panX, y * zoom + panY];
}
function toData(sx, sy) {
  return [(sx - panX) / zoom, (sy - panY) / zoom];
}

const R = () => Math.max(3, Math.min(10, 7 * zoom));

// ── Draw ──────────────────────────────────────────────────────────────────────
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Build group membership map
  const ledGroup = new Map(); // index → {color, name}
  for (const g of groups) {
    for (const idx of g.indices) {
      ledGroup.set(idx, g);
    }
  }

  for (const led of LEDS) {
    const [sx, sy] = toScreen(led.x, led.y);
    const r = R();

    const inGroup = ledGroup.get(led.index);
    const isSel   = selected.has(led.index);
    const isHighlight = highlightedGroup && inGroup === highlightedGroup;

    // Fill
    if (isSel) {
      ctx.fillStyle = '#ffffff';
    } else if (isHighlight) {
      ctx.fillStyle = inGroup.color;
    } else if (inGroup) {
      ctx.fillStyle = inGroup.color + '88'; // dimmed
    } else {
      ctx.fillStyle = '#444';
    }

    ctx.beginPath();
    ctx.arc(sx, sy, r, 0, Math.PI * 2);
    ctx.fill();

    // Outline for selected
    if (isSel) {
      ctx.strokeStyle = '#3a8eff';
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    // Index label (only when zoomed in enough)
    if (zoom > 1.2) {
      ctx.fillStyle = isSel ? '#000' : '#aaa';
      ctx.font = `${Math.max(8, r * 0.9)}px monospace`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(led.index, sx, sy);
    }
  }
}

// ── Interaction ───────────────────────────────────────────────────────────────
let dragging = false, dragStartX, dragStartY, panStartX, panStartY;
let didMove = false;

canvas.addEventListener('mousedown', e => {
  dragging = true; didMove = false;
  dragStartX = e.clientX; dragStartY = e.clientY;
  panStartX = panX; panStartY = panY;
});

canvas.addEventListener('mousemove', e => {
  if (!dragging) return;
  const dx = e.clientX - dragStartX, dy = e.clientY - dragStartY;
  if (Math.abs(dx) > 3 || Math.abs(dy) > 3) didMove = true;
  panX = panStartX + dx;
  panY = panStartY + dy;
  draw();
});

canvas.addEventListener('mouseup', e => {
  dragging = false;
  if (!didMove) handleClick(e);
});

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.12 : 0.89;
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  panX = mx - (mx - panX) * factor;
  panY = my - (my - panY) * factor;
  zoom *= factor;
  draw();
}, { passive: false });

function handleClick(e) {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const [dx, dy] = toData(mx, my);
  const r = R();
  const hitRadius = (r + 4) / zoom;

  let closest = null, closestDist = Infinity;
  for (const led of LEDS) {
    const dist = Math.hypot(led.x - dx, led.y - dy);
    if (dist < hitRadius && dist < closestDist) {
      closest = led; closestDist = dist;
    }
  }

  if (!closest) return;

  if (e.shiftKey || selected.has(closest.index)) {
    selected.delete(closest.index);
  } else {
    selected.add(closest.index);
  }
  updateSelCount();
  draw();
}

// ── Selection helpers ─────────────────────────────────────────────────────────
function clearSelection() { selected.clear(); updateSelCount(); draw(); }
function selectAll() { LEDS.forEach(l => selected.add(l.index)); updateSelCount(); draw(); }

function updateSelCount() {
  const n = selected.size;
  document.getElementById('sel-count').textContent =
    n === 0 ? 'No LEDs selected' : `${n} LED${n === 1 ? '' : 's'} selected`;
}

// ── Groups ────────────────────────────────────────────────────────────────────
function addGroup() {
  const name = document.getElementById('group-name').value.trim();
  if (!name) { alert('Enter a group name'); return; }
  if (selected.size === 0) { alert('Select at least one LED'); return; }

  // Remove these indices from any existing group with the same name
  const existing = groups.find(g => g.name === name);
  if (existing) {
    if (!confirm(`Group "${name}" exists. Replace it?`)) return;
    groups = groups.filter(g => g.name !== name);
  }

  groups.push({ name, color: nextColor(), indices: new Set(selected) });
  clearSelection();
  document.getElementById('group-name').value = '';
  renderGroups();
  draw();
}

function deleteGroup(name) {
  groups = groups.filter(g => g.name !== name);
  if (highlightedGroup && highlightedGroup.name === name) highlightedGroup = null;
  renderGroups();
  draw();
}

function highlightGroup(name) {
  highlightedGroup = name ? groups.find(g => g.name === name) : null;
  draw();
}

function selectGroupLEDs(name) {
  const g = groups.find(g => g.name === name);
  if (!g) return;
  g.indices.forEach(i => selected.add(i));
  updateSelCount();
  draw();
}

function renderGroups() {
  const list = document.getElementById('group-list');
  if (groups.length === 0) {
    list.innerHTML = '<p style="color:#555;font-size:12px">No groups yet. Select LEDs and click Add Group.</p>';
    return;
  }
  list.innerHTML = groups.map(g => {
    const sorted = [...g.indices].sort((a, b) => a - b);
    return `
      <div class="group-item">
        <div class="group-header">
          <div class="group-dot" style="background:${g.color}"></div>
          <span class="group-name">${g.name}</span>
          <span class="group-count">${g.indices.size} LEDs</span>
          <div class="group-actions">
            <button class="btn-secondary" onclick="highlightGroup('${g.name}')">👁</button>
            <button class="btn-secondary" onclick="selectGroupLEDs('${g.name}')">+sel</button>
            <button class="btn-danger" onclick="deleteGroup('${g.name}')">✕</button>
          </div>
        </div>
        <div class="group-indices">${sorted.slice(0, 30).join(', ')}${sorted.length > 30 ? ` … +${sorted.length - 30} more` : ''}</div>
      </div>`;
  }).join('');
}

// ── Export / Import ───────────────────────────────────────────────────────────
function toRanges(indices) {
  const sorted = [...indices].sort((a, b) => a - b);
  const ranges = [];
  let start = sorted[0], end = sorted[0];
  for (let i = 1; i < sorted.length; i++) {
    if (sorted[i] === end + 1) {
      end = sorted[i];
    } else {
      ranges.push({ start, end });
      start = end = sorted[i];
    }
  }
  ranges.push({ start, end });
  return ranges;
}

function exportJSON() {
  if (groups.length === 0) { alert('No groups to export'); return; }
  const output = groups.map(g => ({ name: g.name, ranges: toRanges(g.indices) }));
  const json = JSON.stringify(output, null, 2);

  // Show in a dialog and offer download
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'led-groups.json'; a.click();
  URL.revokeObjectURL(url);

  // Also copy to clipboard
  navigator.clipboard.writeText(json).then(() => {
    alert('Downloaded led-groups.json and copied to clipboard!');
  }).catch(() => {
    alert('Downloaded led-groups.json');
  });
}

function importJSON() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json';
  input.onchange = e => {
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = evt => {
      try {
        const data = JSON.parse(evt.target.result);
        groups = [];
        for (const g of data) {
          const indices = new Set();
          for (const r of g.ranges) {
            for (let i = r.start; i <= r.end; i++) indices.add(i);
          }
          groups.push({ name: g.name, color: nextColor(), indices });
        }
        renderGroups();
        draw();
      } catch(err) {
        alert('Invalid JSON: ' + err.message);
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

// ── Init ──────────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => { fitToWindow(); draw(); });
fitToWindow();
renderGroups();
draw();
</script>
