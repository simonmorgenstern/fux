<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fux LED Namer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-lightbulb"></i> Fux LED Namer</h1>
            <p class="subtitle">Name combinations of LEDs for easy reference.</p>
            <div class="strip-info">
                <div class="strip main-strip">
                    <span class="strip-label">Main Strip</span>
                    <span class="led-count">268 LEDs</span>
                </div>
                <div class="strip side-strip">
                    <span class="strip-label">Side Strip</span>
                    <span class="led-count">120 LEDs</span>
                </div>
                <div class="strip total">
                    <span class="strip-label">Total</span>
                    <span class="led-count">388 LEDs</span>
                </div>
            </div>
        </header>

        <main>
            <section class="led-selection">
                <h2><i class="fas fa-sliders-h"></i> LED Selection</h2>
                <div class="range-inputs">
                    <div class="input-group">
                        <label for="start">Start Index (0-387)</label>
                        <input type="number" id="start" min="0" max="387" value="0">
                    </div>
                    <div class="input-group">
                        <label for="end">End Index (0-387)</label>
                        <input type="number" id="end" min="0" max="387" value="10">
                    </div>
                    <button id="add-range" class="btn secondary"><i class="fas fa-plus"></i> Add Range</button>
                </div>
                <div class="current-ranges">
                    <h3>Selected Ranges</h3>
                    <ul id="range-list">
                        <!-- Ranges will be added here -->
                    </ul>
                    <p id="no-ranges">No ranges added yet. Add a range above.</p>
                </div>
            </section>

            <section class="name-group">
                <h2><i class="fas fa-tag"></i> Name Group</h2>
                <div class="input-group">
                    <label for="group-name">Group Name</label>
                    <input type="text" id="group-name" placeholder="e.g., Front Panel, Back Strip...">
                </div>
                <div class="actions">
                    <button id="save-group" class="btn primary"><i class="fas fa-save"></i> Save Group</button>
                    <button id="preview" class="btn tertiary"><i class="fas fa-eye"></i> Preview</button>
                    <button id="clear" class="btn danger"><i class="fas fa-trash"></i> Clear Selection</button>
                </div>
            </section>

            <section class="saved-groups">
                <h2><i class="fas fa-list"></i> Saved Groups</h2>
                <div class="groups-container" id="groups-container">
                    <p class="loading">Loading saved groups...</p>
                </div>
            </section>
        </main>

        <footer>
            <p>Fux LED Controller | <a href="https://github.com/simonmorgenstern/fux" target="_blank">GitHub</a></p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
